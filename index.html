<style>
:root{--ink:#eaf2f6;--mute:#9fb8c4;--line:rgba(229,184,101,.38);--gold:#e5b865;--gold2:#c9953c;--card:rgba(9,36,56,.72);--field:rgba(5,22,36,.72);--bad:#ff8f86;--ok:#7fd8a4;--warn:#f0b86a;--cy:#74cde8}
*{box-sizing:border-box}
html{color-scheme:dark}
html[data-theme="light"]{color-scheme:light;--ink:#183447;--mute:#526b79;--line:rgba(30,91,125,.25);--gold:#b78125;--gold2:#d2a34d;--card:rgba(255,255,255,.92);--field:#f4f8fb;--bad:#b83e36;--ok:#247a4c;--warn:#9a6413;--cy:#176d91}
html[data-theme="light"] body{background:radial-gradient(900px 500px at 50% -8%,#d8edf5 0,transparent 62%),linear-gradient(180deg,#edf6fa 0,#e3eff5 45%,#d8e8f0 100%) fixed}
html[data-theme="light"] header p{color:#526b79}
html[data-theme="light"] nav a{background:rgba(255,255,255,.65)}
html[data-theme="light"] fieldset,html[data-theme="light"] .box{background:var(--card)}
html[data-theme="light"] input,html[data-theme="light"] select,html[data-theme="light"] textarea{color:#0b1620;background:#f7fbfd;border-color:#b8ccd7}
html[data-theme="light"] select option{background:#fff;color:#0b1620}
html[data-theme="light"] .pump,html[data-theme="light"] .msg,html[data-theme="light"] .tw{background:rgba(255,255,255,.72)}
html[data-theme="light"] .logos b{color:#123b55;text-shadow:none}
body{margin:0;color:var(--ink);font:16px/1.7 Cairo,Tahoma,sans-serif;min-height:100vh;
background:radial-gradient(900px 500px at 50% -8%,#2488ab 0,transparent 62%),linear-gradient(180deg,#0f5e7e 0,#0b3a5c 45%,#071d36 100%) fixed;
padding-top:env(safe-area-inset-top,0)}
header{text-align:center;padding:22px 16px 6px}
@media(max-width:700px){header{padding-top:62px}}
.logos{display:inline-flex;align-items:center;gap:clamp(10px,2.4vw,18px);max-width:100%;color:#fff}
.logos img{height:clamp(58px,12vw,96px);width:clamp(58px,12vw,96px);object-fit:cover;display:block;background:#fff;border:3px solid var(--gold);border-radius:50%;padding:3px;box-shadow:0 0 0 3px rgba(229,184,101,.22),0 6px 18px rgba(0,0,0,.3)}
.logos b{font-size:clamp(20px,5.6vw,48px);font-weight:800;line-height:1.3;white-space:nowrap;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.25)}
.nm{display:flex;flex-direction:column;align-items:center;min-width:0}
.nm span{font-size:clamp(13px,3.8vw,26px);letter-spacing:.03em;color:var(--gold);font-weight:600;white-space:nowrap;direction:ltr;line-height:1.2}
header h1{margin:16px 0 0;font-size:clamp(15px,3.8vw,28px);font-weight:700;line-height:1.3}
header h1 em{font-style:normal;color:var(--gold)}
header p{margin:4px 0 0;color:#bcd3dd;font-size:15px}
nav{display:flex;gap:8px;justify-content:center;padding:14px 16px 0;flex-wrap:wrap}
nav a{color:var(--gold);text-decoration:none;padding:5px 16px;border-radius:99px;border:1px solid var(--line);font-size:14px;background:rgba(5,22,36,.35)}
nav a.on{background:linear-gradient(180deg,#efc977,#c9953c);color:#1b2a33;border-color:transparent;font-weight:700}
main{max-width:980px;margin:auto;padding:16px 16px 48px}
fieldset{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:0 0 18px;padding:20px 16px 14px;backdrop-filter:blur(6px)}
legend{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--gold);padding:3px 16px;margin-inline:6px;border:1px solid var(--line);border-radius:99px;background:rgba(5,22,36,.85)}
legend svg{width:18px;height:18px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
label{display:block;font-size:14px;color:var(--mute)}
input,select,textarea{width:100%;font:inherit;color:#0b1620;background:rgba(226,239,246,.94);border:1px solid rgba(159,184,196,.55);border-radius:10px;padding:9px 12px;margin-top:3px}
select option{background:#eaf3f8;color:#0b1620}
input::placeholder,textarea::placeholder{color:#5f7684}
.f{position:relative;display:block}
.f svg{position:absolute;right:11px;top:50%;margin-top:2px;transform:translateY(-50%);width:18px;height:18px;color:var(--gold);pointer-events:none}
.f input{padding-right:38px}
input::placeholder{color:#6f8a97}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 22px;background:linear-gradient(180deg,#efc977,#c9953c);color:#1b2a33;cursor:pointer}
button.s{background:transparent;color:var(--gold);border:1px solid var(--line)}
button.d{background:linear-gradient(180deg,#ff9d95,#d9544b);color:#2b0d0a}
button:disabled{opacity:.5}
.pump{border:1px dashed var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:rgba(5,22,36,.35)}
.pump h4{margin:0 0 8px;font-size:15px;color:var(--gold);display:flex;align-items:center;gap:6px}
.pump h4 svg{width:16px;height:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
.code{font-size:32px;font-weight:800;letter-spacing:3px;direction:ltr;text-align:center;color:var(--gold)}
.msg{padding:10px 14px;border-radius:10px;margin:10px 0;background:rgba(5,22,36,.6);border:1px solid rgba(159,184,196,.3)}
.msg.e{border-color:var(--bad);color:var(--bad)}
.tw{overflow-x:auto;background:rgba(5,22,36,.45);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid rgba(159,184,196,.18);font-size:14px}
th{color:var(--gold);font-weight:600;white-space:nowrap}
tr.r{cursor:pointer}tr.r:hover{background:rgba(229,184,101,.08)}
.st{padding:2px 12px;border-radius:99px;font-size:13px;border:1px solid currentColor;white-space:nowrap}
.st.n{color:var(--cy)}.st.m{color:var(--warn)}.st.c{color:var(--bad)}.st.x{color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin:10px 0}
.ltr{direction:ltr;text-align:right}
dl{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px;margin:0}dt{color:var(--mute)}dd{margin:0}
a{color:var(--gold)}
.rnote{margin-top:4px;font-size:13.5px;line-height:1.7;color:var(--mute)}
.ci svg{width:18px;height:18px;display:block}
.pb{display:inline-flex;align-items:center;gap:6px;padding:5px 14px}.pb svg{width:18px;height:18px}
#pz{display:none;direction:rtl;font:12px/1.5 Cairo,Tahoma,sans-serif;color:#000;background:#fff}
#pz .pz-h{display:flex;align-items:center;gap:12px;border-bottom:2px solid #000;padding-bottom:6px;margin-bottom:8px}
#pz .pz-h img{height:56px;width:auto}
#pz .pz-n{font-size:20px;font-weight:800;line-height:1.3}
#pz .pz-s{margin-inline-start:auto;text-align:right;font-size:12px}
#pz h5{margin:10px 0 3px;font-size:13px;font-weight:800;border-bottom:1px solid #000;padding-bottom:1px}
#pz table{border-collapse:collapse;width:100%;min-width:0;margin:0}
#pz th,#pz td{border:1px solid #777;padding:2px 6px;text-align:right;font-size:11.5px;vertical-align:top}
#pz th{font-weight:700;white-space:nowrap;width:1%}
#pz .pp th{width:auto;text-align:center}
#pz .pre{white-space:pre-wrap}
#pz.big th,#pz.big td{font-size:15px;padding:6px 10px}
#pz.big li,#pz.big .pre{font-size:15px}
#pz.big h5{font-size:16px}
#pz .ft{margin-top:10px;font-size:10px;text-align:left;direction:ltr}
@page{size:A4;margin:10mm}
@media print{
html,body{background:#fff !important;color:#000 !important;padding:0 !important}
body>*:not(#pz){display:none !important}
#pz{display:block !important}
#pz *{color:#000 !important;background:none !important;box-shadow:none !important}
}
h3{margin:0 0 8px;color:var(--gold)}
/* HRI contact footer on the request page */
.hri-footer{
  margin:22px 0 4px;
  padding:14px 16px;
  background:#101b2b;
  border:1px solid rgba(255,255,255,.13);
  border-radius:13px;
  color:#fff;
  font-size:12px;
  line-height:1.8;
  display:flex;
  align-items:center;
  gap:16px;
  direction:rtl;
}
.hri-footer .hri-info{flex:1;min-width:0}
.hri-footer .hri-line{display:flex;align-items:flex-start;gap:8px;margin:3px 0}
.hri-footer .hri-ico{
  width:19px;min-width:19px;height:19px;
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--gold);font-size:15px;font-weight:700;line-height:1;
}
.hri-footer a{color:#fff;text-decoration:none;direction:ltr;unicode-bidi:embed}
.hri-footer a:hover{text-decoration:underline}
.hri-footer .hri-qr{
  width:104px;height:104px;object-fit:contain;
  background:#fff;border-radius:7px;padding:4px;flex:none;
}
.hri-footer .hri-hours{color:#f0d29d}
@media(max-width:560px){
  .hri-footer{align-items:center;gap:10px;padding:12px;font-size:11px}
  .hri-footer .hri-qr{width:82px;height:82px}
}

</style>

const ico = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const leg = (n, t) => `<legend>${ico(n)}${t}</legend>`;
const fld = (t, n, a) => `<label>${t}<span class="f">${ico(n)}<input ${a}></span></label>`;

function nav(on) {
  $('#nav').innerHTML = [['','طلب جديد'],['status','متابعة / إلغاء طلب'],['admin','المسئول']]
    .map(([h,t]) => `<a href="#${h}" class="${h===on?'on':''}">${t}</a>`).join('');
}
function route() {
  const h = location.hash.slice(1);
  nav(h === 'admin' || h === 'status' ? h : '');
  (h === 'admin' ? admin : h === 'status' ? statusPage : form)();
}
addEventListener('hashchange', route);

function pumpBlock(i) {
  return `<div class="pump" data-i="${i}"><h4>${ico('pump')}الطلمبة ${i+1}</h4><div class="g">` +
    PF.map(([k,t]) => `<label>${t}<input data-k="${k}"></label>`).join('') + `</div></div>`;
}
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
function parseLinks(t) {
  return t.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    const m = l.match(/https?:\/\/\S+/i);
    if (!m) return null;
    return { name: (l.replace(m[0], '').replace(/[:\-–—\s]+$/, '').trim() || 'مرفق').slice(0, 80), url: m[0].slice(0, 500) };
  });
}

  const f = $('#f'), P = $('#pumps');
  const sync = () => {
    const n = Math.min(Math.max(+f.units.value || 1, 1), 20);
    while (P.children.length < n) P.insertAdjacentHTML('beforeend', pumpBlock(P.children.length));
    while (P.children.length > n) P.lastElementChild.remove();
  };
  f.units.oninput = sync; sync();
  f.pref_kind.onchange = () => {
    const p = f.pref_kind.value === 'period';
    $('#l2').hidden = !p; $('#l1').firstChild.textContent = p ? 'من تاريخ' : 'التاريخ';
  };
  f.onsubmit = async e => {
    e.preventDefault();
    const go = $('#go'), out = $('#out'); go.disabled = true; out.innerHTML = '';
    try {
      const nl = $('#links').value.split('\n').map(l => l.trim()).filter(Boolean);
      if (nl.length > 10) throw new Error('الحد الأقصى 10 روابط');
      const atts = parseLinks($('#links').value);
      if (atts.includes(null)) throw new Error('كل سطر في روابط المرفقات لازم يحتوي على رابط يبدأ بـ http');
      const pumps = [...P.children].map(b => Object.fromEntries([...b.querySelectorAll('input')].map(i => [i.dataset.k, i.value])));
      const p = Object.fromEntries(['client_name','contact_name','phone','whatsapp','email','units','motor_type','motor_power_w','pref_kind','date_from','date_to','notes'].map(k => [k, f[k].value]));
      const { data, error } = await sb.rpc('submit_request', { p: { ...p, pumps, attachments: atts } });
      if (error) throw error;
      app.innerHTML = `<div class="box"><h3>تم تسجيل الطلب</h3>
        <p>رقم الطلب</p><div class="code">${esc(data.serial)}</div>
        <p>الرقم السري للإلغاء والمتابعة</p><div class="code">${esc(data.code)}</div>
        <div class="msg e">احفظ الرقمين الآن. الرقم السري يظهر هنا مرة واحدة فقط ولا يمكن استرجاعه.</div>
        <div class="row"><button class="pb" id="svimg">${ico('download')}حفظ كصورة</button><button class="s pb" id="cpy">نسخ الرقمين</button></div></div>`;
      $('#svimg').onclick = () => saveCard(data.serial, data.code);
      $('#cpy').onclick = () => navigator.clipboard.writeText(`رقم الطلب: ${data.serial}
الرقم السري: ${data.code}`);
    } catch (err) {
      out.innerHTML = `<div class="msg e">تعذر الإرسال: ${esc(err.message || err)}</div>`; go.disabled = false;
    }
  };
}

function statusPage() {
  app.innerHTML = `<fieldset>${leg('key','متابعة أو إلغاء طلب')}<div class="g">
    ${fld('رقم الطلب','hash','id="s" class="ltr" inputmode="numeric"')}
    ${fld('الرقم السري','key','id="c" class="ltr"')}</div>
    <div class="row"><button id="chk">عرض حالة الطلب</button></div><div id="res"></div></fieldset>`;
  const get = async () => (await sb.rpc('get_status', { p_serial: $('#s').value.trim(), p_code: $('#c').value.trim().toUpperCase() })).data;

    const ok = r.status === 'مجدول' && r.scheduled_at;
    o.innerHTML = `<div class="msg"><dl><dt>رقم الطلب</dt><dd>${esc(r.serial)}</dd><dt>العميل</dt><dd>${esc(r.client_name)}</dd><dt>الحالة</dt><dd>${badge(r.status)}</dd>
      ${r.scheduled_at ? `<dt>موعد الاختبار</dt><dd>${dt(r.scheduled_at)}</dd>` : ''}
      ${r.requirements && !ok ? `<dt>الاشتراطات</dt><dd style="white-space:pre-wrap">${esc(r.requirements)}</dd>` : ''}${r.report_url ? `<dt>تقرير الاختبار</dt><dd>${reportLink(r.report_url)}<div class="rnote">${REPORT_NOTE}</div></dd>` : ''}</dl></div>
      ${ok ? `<div class="msg"><b style="color:var(--gold)">اشتراطات الحضور</b><ol style="margin:6px 0 0;padding-inline-start:22px">${COND.map(c => `<li>${c}</li>`).join('')}</ol>${r.requirements ? `<p style="margin:8px 0 0"><b>اشتراطات إضافية من المعهد:</b><br><span style="white-space:pre-wrap">${esc(r.requirements)}</span></p>` : ''}</div>
      <button class="pb" id="prc">${ico('print')}طباعة الطلب</button> ` : ''}
      ${['جديد','مجدول'].includes(r.status) ? '<button class="d" id="can">إلغاء الطلب</button>' : ''}`;
    if (ok) $('#prc').onclick = () => printCustomer(r);
    const b = $('#can');
    if (b) b.onclick = async () => {
      if (!confirm('تأكيد إلغاء الطلب؟')) return;
      const { data } = await sb.rpc('cancel_request', { p_serial: $('#s').value.trim(), p_code: $('#c').value.trim().toUpperCase() });
      if (data) show(); else o.insertAdjacentHTML('afterbegin', '<div class="msg e">تعذر الإلغاء</div>');

  $('#chk').onclick = show;
}

let tab = 'cur', yr = '', mo = '', rows = [];
const MN = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
async function admin() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) {
    app.innerHTML = `<fieldset style="max-width:420px;margin:auto">${leg('user','دخول المسئول')}
      ${fld('الإيميل','mail','id="em" type="email" class="ltr"')}
      <div style="margin-top:10px">${fld('كلمة السر','key','id="pw" type="password" class="ltr"')}</div>
      <div class="row"><button id="in">دخول</button></div><div id="lerr"></div></fieldset>`;
    $('#in').onclick = async () => {
      const { error } = await sb.auth.signInWithPassword({ email: $('#em').value.trim(), password: $('#pw').value });
      if (error) {
        const m = error.message || '';
        const t = /not confirmed/i.test(m) ? 'الإيميل غير مؤكد في Supabase (اعمل Confirm للمستخدم)'
          : /invalid login/i.test(m) ? 'الإيميل أو كلمة السر غير صحيحة'
          : 'تعذر الدخول: ' + m;
        $('#lerr').innerHTML = `<div class="msg e">${esc(t)}</div>`;
      } else admin();
    };
    return;
  }
  const { data, error } = await sb.from('requests').select('*').order('serial', { ascending: false });
  if (error) { app.innerHTML = `<div class="msg e">${esc(error.message)}</div>`; return; }
  rows = data; list();
}
function list() {
  const cur = tab === 'cur';
  const yrs = [...new Set(rows.map(r => new Date(r.created_at).getFullYear()))].sort((a, b) => b - a);
  const inTab = rows.filter(r => cur ? r.status !== 'منفذ' : r.status === 'منفذ');
  const vis = inTab.filter(r => { const d = new Date(r.created_at);
    return (!yr || String(d.getFullYear()) === yr) && (mo === '' || String(d.getMonth()) === mo); });
  app.innerHTML = `<div class="row"><button class="${cur?'':'s'}" id="t1">الطلبات الحالية (${rows.filter(r => r.status !== 'منفذ').length})</button>
    <button class="${cur?'s':''}" id="t2">المنفذة (${rows.filter(r => r.status === 'منفذ').length})</button>
    <button class="s" id="out" style="margin-inline-start:auto">خروج</button></div>
    <div class="row"><label>السنة<select id="yr"><option value="">الكل</option>${yrs.map(y => `<option ${String(y)===yr?'selected':''}>${y}</option>`).join('')}</select></label>
    <label>الشهر<select id="mo"><option value="">الكل</option>${MN.map((m, i) => `<option value="${i}" ${String(i)===mo?'selected':''}>${m}</option>`).join('')}</select></label>
    <span style="color:var(--mute);font-size:14px;align-self:center">عرض ${vis.length} من ${inTab.length} (حسب تاريخ تسجيل الطلب)</span></div>
    <div class="tw"><table><tr><th>رقم الطلب</th><th>التاريخ</th><th>العميل</th><th>الوحدات</th><th>الحالة</th><th>${cur?'الموعد':'التقرير'}</th></tr>
    ${vis.map(r => `<tr class="r" data-id="${r.id}"><td>${esc(r.serial)}</td><td>${dd(r.created_at)}</td><td>${esc(r.client_name)}</td><td>${r.units}</td><td>${badge(r.status)}</td>
      <td>${cur ? dt(r.scheduled_at) : (r.report_url ? 'متاح' : '')}</td></tr>`).join('') || '<tr><td colspan="6">لا توجد طلبات</td></tr>'}</table></div><div id="det"></div>`;
  $('#t1').onclick = () => { tab = 'cur'; list(); };
  $('#t2').onclick = () => { tab = 'done'; list(); };
  $('#yr').onchange = e => { yr = e.target.value; list(); };
  $('#mo').onchange = e => { mo = e.target.value; list(); };
  $('#out').onclick = async () => { await sb.auth.signOut(); admin(); };
  app.querySelectorAll('tr.r').forEach(tr => tr.onclick = () => detail(rows.find(r => r.id === tr.dataset.id)));
}
const COND = ['يتم الالتزام بالحضور في الموعد المحدد بمقر المعهد.', 'يتم طباعة الطلب الخاص بكم والمسجل به رقم الطلب والموعد.'];
async function saveCard(serial, code) {
  try { await document.fonts.load('700 40px Cairo'); await document.fonts.load('400 24px Cairo'); } catch (e) {}
  const W = 1000, H = 650, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0f5e7e'); g.addColorStop(1, '#071d36');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  x.strokeStyle = '#e5b865'; x.lineWidth = 4; x.strokeRect(18, 18, W - 36, H - 36);
  const logo = new Image(); logo.src = ($('.logos img') || {}).src || '';
  await new Promise(r => { logo.onload = r; logo.onerror = r; });
  if (logo.naturalWidth) {
    x.fillStyle = '#fff'; x.fillRect(W / 2 - 46, 38, 92, 92);
    x.strokeStyle = '#e5b865'; x.lineWidth = 3; x.strokeRect(W / 2 - 46, 38, 92, 92);
    x.drawImage(logo, W / 2 - 42, 42, 84, 84);
  }
  x.textAlign = 'center'; x.textBaseline = 'middle';
  const t = (txt, y, font, color, dir) => { x.direction = dir || 'rtl'; x.font = font; x.fillStyle = color; x.fillText(txt, W / 2, y); };
  const F = 'Cairo, Tahoma, sans-serif';
  t('معهد بحوث الهيدروليكا', 164, `800 36px ${F}`, '#fff');
  t('Hydraulics Research Institute', 200, `600 20px ${F}`, '#e5b865', 'ltr');
  t('تم تسجيل طلب اختبار الطلمبات', 252, `700 28px ${F}`, '#fff');
  t('رقم الطلب', 306, `400 22px ${F}`, '#bcd3dd');
  t(serial, 358, `800 64px ${F}`, '#e5b865', 'ltr');
  t('الرقم السري للمتابعة والإلغاء', 428, `400 22px ${F}`, '#bcd3dd');
  t(code, 482, `800 56px ${F}`, '#e5b865', 'ltr');
  t('احتفظ بهذه الصورة: الرقم السري لا يظهر مرة أخرى', 548, `700 21px ${F}`, '#ff9d95');
  t(new Date().toLocaleDateString('en-GB') + '  |  ' + location.href.split('#')[0] + '#status', 598, `400 15px ${F}`, '#9fb8c4', 'ltr');
  const blob = await new Promise(r => c.toBlob(r, 'image/png'));
  const name = `HRI-request-${serial}.png`;
  const file = new File([blob], name, { type: 'image/png' });
  if (/iPhone|iPad|iPod/i.test(navigator.userAgent) && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

const sec = (ic, t, body) => `<fieldset style="margin:0 0 14px">${leg(ic, t)}${body}</fieldset>`;
const crow = (ic, label, val, href) => `<div style="display:flex;align-items:center;gap:10px;margin:6px 0;flex-wrap:wrap"><span class="ci" style="color:var(--gold)">${ico(ic)}</span><span style="color:var(--mute);min-width:64px">${label}</span>${val ? (href ? `<a class="ltr" href="${esc(href)}" target="_blank" rel="noopener">${esc(val)}</a>` : `<span>${esc(val)}</span>`) : '<span style="color:var(--mute)">—</span>'}</div>`;
async function detail(r) {
  const att = (r.attachments || []).filter(a => safeUrl(a.url)).map(a => `<a href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">${esc(a.name)}</a>`);
  const { data: logs } = await sb.from('request_log').select('*').eq('request_id', r.id).order('changed_at', { ascending: true });
  const FL = { status: 'الحالة', scheduled_at: 'موعد الاختبار المحدد', requirements: 'الاشتراطات', report_url: 'رابط التقرير' };
  const lv = (f, v) => v == null || v === '' ? '—' : (f === 'scheduled_at' ? dt(v) : esc(v));
  const logHtml = (logs || []).length ? `<div class="tw"><table><tr><th>الوقت</th><th>بواسطة</th><th>البند</th><th>من</th><th>إلى</th></tr>${logs.map(l => `<tr><td>${dt(l.changed_at)}</td><td>${esc(l.changed_by)}</td><td>${FL[l.field] || esc(l.field)}</td><td>${lv(l.field, l.old_value)}</td><td>${lv(l.field, l.new_value)}</td></tr>`).join('')}</table></div>` : '<span style="color:var(--mute)">لا توجد تغييرات مسجلة</span>';
  const loc = r.scheduled_at ? new Date(new Date(r.scheduled_at) - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 16) : '';
  const D = $('#det');
  D.innerHTML = `<div class="box" style="margin-top:16px"><h3 style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">طلب ${esc(r.serial)} ${badge(r.status)}<button type="button" class="s pb" id="pr" style="margin-inline-start:auto">${ico('print')}طباعة</button></h3>
    ${sec('building', 'بيانات العميل', `<dl><dt>اسم العميل / الشركة</dt><dd>${esc(r.client_name)}</dd><dt>اسم المسئول</dt><dd>${esc(r.contact_name) || '—'}</dd></dl>`)}
    ${sec('phone', 'التواصل',
      crow('phone', 'التليفون', r.phone, r.phone && 'tel:' + String(r.phone).replace(/[^\d+]/g, '')) +
      crow('wa', 'واتساب', r.whatsapp, r.whatsapp && 'https://wa.me/' + String(r.whatsapp).replace(/\D/g, '')) +
      crow('mail', 'الإيميل', r.email, r.email && 'mailto:' + r.email))}
    ${sec('pump', 'بيانات الطلمبات والمحرك', `<p style="margin:0 0 8px">عدد الوحدات: <b>${r.units}</b></p>
      <div class="tw" style="margin-bottom:12px"><table><tr><th>#</th>${PF.map(([, t]) => `<th>${t}</th>`).join('')}</tr>
      ${(r.pumps || []).map((p, i) => `<tr><td>${i + 1}</td>${PF.map(([k]) => `<td>${esc(p[k])}</td>`).join('')}</tr>`).join('')}</table></div>
      <dl><dt>نوع المحرك</dt><dd>${esc(r.motor_type) || '—'}</dd><dt>قدرة المحرك (وات)</dt><dd>${esc(r.motor_power_w ?? '—')}</dd></dl>`)}
    ${sec('cal', 'موعد الاختبار المطلوب من العميل', r.pref_kind === 'period' ? `من ${dd(r.date_from)} إلى ${dd(r.date_to)}` : (dd(r.date_from) || '—'))}
    ${sec('note', 'ملاحظات وروابط المرفقات', `<dl><dt>ملاحظات</dt><dd style="white-space:pre-wrap">${esc(r.notes) || '—'}</dd><dt>روابط المرفقات</dt><dd>${att.join('<br>') || '—'}</dd></dl>`)}
    <div class="g"><label>الحالة<select id="st">${['جديد','مجدول','ملغي','منفذ'].map(s => `<option ${s===r.status?'selected':''}>${s}</option>`).join('')}</select></label>
    <label>موعد الاختبار (تاريخ وساعة)<input id="at" type="datetime-local" value="${loc}"><span class="rnote" id="atp" style="display:block"></span></label></div>
    <label style="margin-top:8px">الاشتراطات المطلوبة من العميل<textarea id="rq" rows="3">${esc(r.requirements)}</textarea></label>
    <label style="margin-top:8px">رابط تقرير الاختبار<input id="ru" class="ltr" placeholder="https://..." value="${esc(r.report_url)}"></label>
    <div class="rnote">يظهر للعميل في طلبه بعد تسجيل التنفيذ، ومعه الملحوظة: ${REPORT_NOTE}</div>
    ${safeUrl(r.report_url) ? `<p>معاينة رابط العميل: ${reportLink(r.report_url)}<br><span class="rnote">${REPORT_NOTE}</span></p>` : ''}

    <div class="row"><button id="sv">حفظ</button><button id="ex" class="s">تم التنفيذ ونقله لجدول المنفذ</button></div><div id="dm"></div></div>`;
  D.scrollIntoView({ behavior: 'smooth' });

  $('#at').oninput = atp; $('#at').onchange = atp; atp();
  $('#pr').onclick = () => printReq({ ...r, status: $('#st').value,
    scheduled_at: $('#at').value ? new Date($('#at').value).toISOString() : null,
    requirements: $('#rq').value, report_url: $('#ru').value.trim() || null });
  const save = async done => {
    try {
      const enteredUrl = $('#ru').value.trim();
      const url = directReportUrl(enteredUrl);
      if (url && !safeUrl(url)) throw new Error('رابط التقرير لازم يبدأ بـ http أو https');
      if (done && !url && !confirm('لم يتم إضافة رابط للتقرير. تكمل التنفيذ؟')) return;
      const at = $('#at').value;
      const u = { status: done ? 'منفذ' : $('#st').value, scheduled_at: at ? new Date(at).toISOString() : null,
        requirements: $('#rq').value, report_url: url || null };
      if (u.status === 'منفذ' && !r.executed_at) u.executed_at = new Date().toISOString();
      const { error } = await sb.from('requests').update(u).eq('id', r.id);
      if (error) throw error;
      admin();
    } catch (e) { $('#dm').innerHTML = `<div class="msg e">${esc(e.message || e)}</div>`; }
  };
  $('#sv').onclick = () => save(false);
  $('#ex').onclick = () => save(true);
}
